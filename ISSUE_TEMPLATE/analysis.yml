name: Analysis
description: Turn a request into specs, child tickets and ADRs
type: Analysis
labels: ["agent:planner"]
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What you want, in your own words
    validations: {required: true}
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why it is needed, related tickets, KB concepts
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Limits, non-goals, things not to touch
  - type: checkboxes
    id: output
    attributes:
      label: Expected output
      options:
        - label: Specification
        - label: Child tickets
        - label: ADR
